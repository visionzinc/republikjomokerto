      content="Cetak Kartu Tanda Penjomok (KTP), pasang pin di Ngawi atau Sumeru, bagikan momen, dan mengobrol bersama warga Republik Jomokerto."

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('jomok_theme_mode') || 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.dataset.theme = isDark ? 'dark' : 'light';
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F7F4] text-[#1C2421] dark:bg-[#0E1412] dark:text-[#ECEBE6] antialiased transition-colors duration-200 selection:bg-[#0F5E46]/20 selection:text-[#0F5E46] dark:selection:bg-[#34B88A]/25 dark:selection:text-[#34B88A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
